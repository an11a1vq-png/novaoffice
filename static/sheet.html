<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaSheet - Bảng Tính Thông Minh Đa Trang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-white h-screen w-screen flex flex-col overflow-hidden select-none text-slate-800">

  <!-- Top Navigation & Ribbon -->
  <header class="bg-white border-b border-slate-200 z-30 shadow-sm shrink-0">
    <!-- Top Bar -->
    <div class="px-4 py-2 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="p-2 text-slate-500 hover:text-emerald-600 hover:bg-slate-100 rounded-lg transition" title="Về trang chủ">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center shadow">
            <i data-lucide="table" class="w-4 h-4"></i>
          </div>
          <div>
            <input 
              type="text" 
              id="sheetTitleInput" 
              value="Bảng tính không tên" 
              class="font-semibold text-sm text-slate-800 bg-transparent hover:bg-slate-100 focus:bg-white focus:ring-1 focus:ring-emerald-500 px-2 py-0.5 rounded outline-none border border-transparent transition w-64 md:w-80 truncate"
            >
          </div>
        </div>

        <div id="saveStatus" class="flex items-center text-xs text-slate-400 space-x-1 pl-2">
          <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-500"></i>
          <span>Đã lưu</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" id="darkModeBtn" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition" title="Đổi giao diện Sáng / Tối">
          <i data-lucide="moon" class="w-4 h-4" id="darkModeIcon"></i>
        </button>

        <button onclick="openChartModal()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-lg transition">
          <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i>
          <span>Vẽ biểu đồ</span>
        </button>

        <button onclick="toggleNovaAi()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold bg-gradient-to-r from-cyan-600 via-indigo-600 to-purple-600 hover:from-cyan-500 hover:to-purple-500 text-white rounded-lg shadow-sm transition">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 animate-pulse"></i>
          <span>Nova AI</span>
        </button>

        <button onclick="exportXlsx()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-lg transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Xuất Excel (.xlsx)</span>
        </button>

        <button onclick="exportCsv()" class="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg transition">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
          <span>Xuất CSV</span>
        </button>
      </div>
    </div>

    <!-- Multi-Tab Ribbon Strip -->
    <div class="ribbon-tabs-nav">
      <button class="ribbon-tab-btn active" data-tab="tab-sheet-home" onclick="switchSheetTab('tab-sheet-home')">
        <i data-lucide="home" class="w-3.5 h-3.5 inline mr-1"></i> Trang chủ
      </button>
      <button class="ribbon-tab-btn" data-tab="tab-sheet-data" onclick="switchSheetTab('tab-sheet-data')">
        <i data-lucide="database" class="w-3.5 h-3.5 inline mr-1"></i> Dữ liệu & Sắp xếp
      </button>
      <button class="ribbon-tab-btn" data-tab="tab-sheet-formulas" onclick="switchSheetTab('tab-sheet-formulas')">
        <i data-lucide="sigma" class="w-3.5 h-3.5 inline mr-1"></i> Công thức
      </button>
      <button class="ribbon-tab-btn ai-tab" data-tab="tab-sheet-ai" onclick="switchSheetTab('tab-sheet-ai')">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 inline mr-1 text-purple-600"></i> ✨ Nova AI Copilot
      </button>
    </div>

    <!-- Tab 1: Trang chủ (Home) -->
    <div id="tab-sheet-home" class="ribbon-panel active bg-slate-50 text-xs">
      <button onclick="toggleFormat('bold')" id="btnBold" class="ribbon-btn font-bold" title="In đậm (Ctrl+B)"><i data-lucide="bold" class="w-4 h-4"></i></button>
      <button onclick="toggleFormat('italic')" id="btnItalic" class="ribbon-btn italic" title="In nghiêng (Ctrl+I)"><i data-lucide="italic" class="w-4 h-4"></i></button>
      <div class="ribbon-separator"></div>

      <!-- Colors -->
      <div class="flex items-center space-x-1" title="Màu chữ">
        <i data-lucide="palette" class="w-3.5 h-3.5 text-slate-500"></i>
        <input type="color" id="cellTextColor" onchange="applyColor('color', this.value)" value="#0f172a" class="w-6 h-6 p-0 border-0 rounded cursor-pointer bg-transparent">
      </div>
      <div class="flex items-center space-x-1" title="Màu nền ô">
        <i data-lucide="paint-bucket" class="w-3.5 h-3.5 text-slate-500"></i>
        <input type="color" id="cellBgColor" onchange="applyColor('bg', this.value)" value="#ffffff" class="w-6 h-6 p-0 border-0 rounded cursor-pointer bg-transparent">
      </div>
      <div class="ribbon-separator"></div>

      <!-- Alignment -->
      <button onclick="setAlignment('left')" class="ribbon-btn" title="Căn trái"><i data-lucide="align-left" class="w-4 h-4"></i></button>
      <button onclick="setAlignment('center')" class="ribbon-btn" title="Căn giữa"><i data-lucide="align-center" class="w-4 h-4"></i></button>
      <button onclick="setAlignment('right')" class="ribbon-btn" title="Căn phải"><i data-lucide="align-right" class="w-4 h-4"></i></button>
      <div class="ribbon-separator"></div>

      <!-- Number Formatting -->
      <select onchange="applyNumberFormat(this.value)" id="numFormatSelect" class="bg-white border border-slate-200 rounded px-2 py-1 text-xs text-slate-700 outline-none" title="Định dạng số hiển thị">
        <option value="general">Định dạng: Chuẩn</option>
        <option value="currency">Định dạng: Tiền tệ (₫)</option>
        <option value="percent">Định dạng: Phần trăm (%)</option>
        <option value="date">Định dạng: Ngày (dd/mm/yyyy)</option>
        <option value="number">Định dạng: Số (1,234.56)</option>
      </select>

      <div class="ribbon-separator"></div>
      <button onclick="clearCurrentCell()" class="ribbon-btn text-rose-500" title="Xóa dữ liệu ô đang chọn"><i data-lucide="eraser" class="w-4 h-4 mr-1"></i> Xóa ô</button>
    </div>

    <!-- Tab 2: Dữ liệu & Sắp xếp (Data & Sort) -->
    <div id="tab-sheet-data" class="ribbon-panel bg-slate-50 text-xs">
      <button onclick="sortActiveColumn(true)" class="ribbon-btn font-medium text-emerald-700" title="Sắp xếp cột đang chọn từ A đến Z">
        <i data-lucide="arrow-down-a-z" class="w-4 h-4 mr-1"></i> Sắp xếp A &rarr; Z
      </button>
      <button onclick="sortActiveColumn(false)" class="ribbon-btn font-medium text-emerald-700" title="Sắp xếp cột đang chọn từ Z đến A">
        <i data-lucide="arrow-down-z-a" class="w-4 h-4 mr-1"></i> Sắp xếp Z &rarr; A
      </button>
      <div class="ribbon-separator"></div>

      <button onclick="toggleFreezeFirstCol()" id="btnFreezeCol" class="ribbon-btn font-medium text-blue-700" title="Cố định cột đầu tiên (Cột A) khi cuộn ngang">
        <i data-lucide="pin" class="w-4 h-4 mr-1"></i> Cố định Cột A
      </button>
      <div class="ribbon-separator"></div>

      <button onclick="insertRowAbove()" class="ribbon-btn" title="Chèn 1 dòng mới phía trên">
        <i data-lucide="rows" class="w-4 h-4 mr-1 text-blue-600"></i> + Chèn Dòng
      </button>
      <button onclick="deleteCurrentRow()" class="ribbon-btn text-rose-600" title="Xóa dòng hiện tại">
        <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> Xóa Dòng
      </button>
      <div class="ribbon-separator"></div>

      <button onclick="findInSheetPrompt()" class="ribbon-btn text-blue-600 font-medium" title="Tìm ô dữ liệu trong sheet">
        <i data-lucide="search" class="w-4 h-4 mr-1"></i> Tìm trong bảng
      </button>
    </div>

    <!-- Tab 3: Công thức (Formulas) -->
    <div id="tab-sheet-formulas" class="ribbon-panel bg-slate-50 text-xs">
      <button onclick="insertFormula('SUM')" class="ribbon-btn font-semibold text-emerald-700 bg-emerald-50/60" title="Tổng =SUM(...)">&sum; SUM</button>
      <button onclick="insertFormula('AVERAGE')" class="ribbon-btn text-slate-700" title="Trung bình =AVERAGE(...)">AVERAGE</button>
      <button onclick="insertFormula('COUNT')" class="ribbon-btn text-slate-700" title="Đếm số ô =COUNT(...)">COUNT</button>
      <button onclick="insertFormula('MAX')" class="ribbon-btn text-slate-700" title="Giá trị lớn nhất =MAX(...)">MAX</button>
      <button onclick="insertFormula('MIN')" class="ribbon-btn text-slate-700" title="Giá trị nhỏ nhất =MIN(...)">MIN</button>
      <div class="ribbon-separator"></div>
      <button onclick="insertFormula('IF')" class="ribbon-btn font-medium text-indigo-700" title="Điều kiện =IF(điều_kiện, đúng, sai)">IF</button>
      <button onclick="insertFormula('VLOOKUP')" class="ribbon-btn font-medium text-indigo-700" title="Dò tìm =VLOOKUP(giá_trị, bảng, số_cột, 0)">VLOOKUP</button>
      <button onclick="insertFormula('CONCATENATE')" class="ribbon-btn font-medium text-indigo-700" title="Nối chuỗi =CONCATENATE(chuỗi1, chuỗi2)">CONCAT</button>
    </div>

    <!-- Tab 4: ✨ Nova AI Copilot -->
    <div id="tab-sheet-ai" class="ribbon-panel bg-purple-50/50 text-xs">
      <button onclick="triggerSheetFormulaPrompt()" class="ribbon-btn font-semibold text-purple-800 bg-purple-100 hover:bg-purple-200 border border-purple-300" title="Nhập yêu cầu bằng tiếng Việt để Nova AI tự viết công thức Excel">
        <i data-lucide="sparkles" class="w-4 h-4 mr-1 text-purple-600 animate-pulse"></i>
        <span>✨ Viết Công Thức Bằng AI</span>
      </button>

      <button onclick="triggerAiSheetClean()" class="ribbon-btn font-medium text-indigo-700" title="AI phân tích và làm sạch dữ liệu bảng">
        <i data-lucide="wand-2" class="w-3.5 h-3.5 mr-1 text-indigo-600"></i> AI Gợi Ý Phân Tích
      </button>
      <div class="ribbon-separator"></div>
      <div class="text-[11px] text-purple-600 font-medium">
        💡 Trợ lý AI có thể sinh các công thức SUMIFS, VLOOKUP, INDEX/MATCH chỉ từ văn bản tự nhiên.
      </div>
    </div>

    <!-- Formula Bar -->
    <div class="px-4 py-1.5 bg-white border-t border-slate-200 flex items-center space-x-2 text-xs">
      <div id="activeCellAddress" class="w-14 py-1 px-2 font-mono font-bold text-center bg-slate-100 text-slate-700 rounded border border-slate-200">
        A1
      </div>
      <div class="text-slate-400 font-serif italic text-sm px-1 font-bold select-none">
        fx
      </div>
      <input 
        type="text" 
        id="formulaBarInput" 
        placeholder="Nhập giá trị hoặc công thức (ví dụ: =SUM(A1:A5) hoặc =A1*1.1)" 
        class="flex-1 py-1 px-2 text-xs font-mono bg-white border border-slate-200 rounded focus:border-emerald-500 focus:ring-1 focus:ring-emerald-200 outline-none"
      >
    </div>
  </header>

  <!-- Spreadsheet Grid -->
  <div class="sheet-grid-container" id="gridContainer">
    <table class="sheet-table" id="sheetTable">
      <!-- Generated by sheet.js -->
    </table>
  </div>

  <!-- Bottom Sheet Tabs Bar (Multi-Sheet Management) -->
  <footer class="bg-slate-100 border-t border-slate-200 px-4 py-1.5 text-xs flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center space-x-1.5" id="sheetTabsWrapper">
      <div class="flex items-center space-x-1" id="sheetTabsContainer">
        <!-- Rendered dynamically by sheet.js -->
      </div>
      <button onclick="addNewSheetTab()" class="p-1 text-slate-500 hover:text-emerald-700 hover:bg-slate-200 rounded transition font-bold" title="Thêm trang tính mới (+)">
        <i data-lucide="plus" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Quick Stats Bar on Selection -->
    <div id="rangeStatsBar" class="flex items-center space-x-2 text-[11px] font-mono font-medium hidden">
      <span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded shadow-xs" id="statCount">COUNT: 0</span>
      <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded shadow-xs" id="statSum">SUM: 0</span>
      <span class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded shadow-xs" id="statAvg">AVG: 0</span>
      <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded shadow-xs" id="statMin">MIN: 0</span>
      <span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded shadow-xs" id="statMax">MAX: 0</span>
    </div>

    <div class="text-slate-400 text-[11px] flex items-center gap-2" id="sheetFooterHint">
      <span>Nhấp đúp vào tên sheet để đổi tên</span>
      <span>&bull;</span>
      <span class="text-emerald-700 font-semibold">NovaSheet Multi-Tab Engine</span>
    </div>
  </footer>

  <!-- Chart Modal -->
  <div id="chartModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="bar-chart-2" class="w-5 h-5 text-indigo-600"></i>
          Tạo Biểu Đồ Dữ Liệu
        </h3>
        <button onclick="closeChartModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="grid grid-cols-2 gap-4 text-xs">
        <div>
          <label class="block font-medium text-slate-600 mb-1">Vùng dữ liệu (Ví dụ: A1:D3)</label>
          <input type="text" id="chartRangeInput" value="A1:B3" class="w-full p-2 border rounded-lg font-mono">
        </div>
        <div>
          <label class="block font-medium text-slate-600 mb-1">Loại biểu đồ</label>
          <select id="chartTypeSelect" class="w-full p-2 border rounded-lg bg-white">
            <option value="bar">Biểu đồ cột (Bar Chart)</option>
            <option value="line">Biểu đồ đường (Line Chart)</option>
            <option value="pie">Biểu đồ tròn (Pie Chart)</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end">
        <button onclick="renderChart()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg shadow transition">
          Vẽ biểu đồ
        </button>
      </div>

      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex items-center justify-center min-h-[300px]">
        <canvas id="chartCanvas"></canvas>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="/static/js/ai_assistant.js"></script>
  <script src="/static/js/sheet.js"></script>
</body>
</html>
